[site]
name = "sulattphone-webcraft-oneamongstmany"
url = "https://sulattphone-webcraft-oneamongstmany.vercel.app"
description = "A faithful replication of oneamongstmany.com — scroll-driven data visualization with video backgrounds transitioning on scroll, 3D terrain and glowing orbs representing women in computing."
category = "personal-intelligence"

[site.tech]
stack = ["React", "Three.js", "Vite", "TypeScript"]
hosting = "vercel"
hosting_access_granted = false

[site.assets]
images = ["bg-pattern.png"]
videos = ["fancy_reduced.mp4", "timelapse_reduced.mp4"]
models_3d = []
svgs = []
fonts = ["Open Sans 400", "Open Sans 400i", "Open Sans 700"]

[site.prd]
file = "PRD.md"
setup = "npm install && npm run dev"
backend = "None — fully static frontend with no backend services."

[[screenshots]]
route = "/"
file = "screenshots/home-desktop.png"
device = "desktop"

[[screenshots]]
route = "/"
file = "screenshots/home-mobile.png"
device = "mobile"
